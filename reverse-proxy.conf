server {
    listen 54322 ssl;
    server_name gaamsihei.io www.gaamsihei.io; # Specific domain matching

    # Custom Certificate Settings
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Security protocols (authoritative recommendation)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        # Proxying to your local HTTP service
        proxy_pass http://192.168.1.1x:8082/public;

        # Essential headers for the backend to see the real client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
